name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate raw data (deterministic seed)
        run: python -m marketing_pipeline.generate
      - name: Build models, run quality checks, render report
        run: python -m marketing_pipeline.run
      - name: Tests
        run: pytest -q
